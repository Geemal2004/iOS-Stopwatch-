name: Generate iOS .ipa

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build:
    # CRITICAL: This spins up a macOS virtual machine in the cloud
    runs-on: macos-14 

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Select the correct Xcode version
      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      # Step 3: Build the application archive
      # Replace 'Stopwatch' with the actual name of your .xcodeproj/target
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Stopwatch.xcodeproj \
            -scheme Stopwatch \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/Stopwatch.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Step 4: Export the Archive as an unsigned .ipa file
      - name: Export .ipa
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r $RUNNER_TEMP/Stopwatch.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r Stopwatch.ipa Payload

      # Step 5: Upload the generated .ipa so you can download it on Windows
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: ${{ runner.temp }}/Stopwatch.ipa